trend_analysis_task:
  description: >
    Search the current market using web sources and identify:

    - Top trending domains
    - Trending jobs and career opportunities
    - Emerging technologies
    - Customer demand
    - Industry growth opportunities
    - Recommended startup and business ideas

    Provide the latest market information and recommendations.

  expected_output: >
    A detailed report containing:

    1. Trending Domains
    2. Trending Jobs
    3. Emerging Technologies
    4. Customer Demand
    5. Industry Growth Opportunities
    6. Recommended Business and Startup Ideas.

    IMPORTANT: You MUST append a strict JSON code block at the very end of your response containing the exact metrics, formatted exactly like this:
    ```json
    {
      "cagr": 15.5,
      "top_region": "North America",
      "market_size": 50000000,
      "keywords": ["AI", "Sustainability"],
      "historical_growth": [
        {"year": "Y1", "growth": 10},
        {"year": "Y2", "growth": 12},
        {"year": "Y3", "growth": 15},
        {"year": "Y4", "growth": 18},
        {"year": "Y5", "growth": 20}
      ]
    }
    ```

business_discovery_task:
  description: >
    Analyze the domain {field} with a budget of {budget}.

    Identify:

    - Businesses that can be started
    - Jobs suitable for this domain and budget
    - Current market demand
    - Competitors
    - Revenue opportunities
    - Budget feasibility
    - Risks and recommendations

  expected_output: >
    A detailed report containing:

    1. Suggested Businesses
    2. Suggested Jobs
    3. Market Demand Analysis
    4. Competitor Analysis
    5. Revenue Opportunities
    6. Budget Feasibility
    7. Risks
    8. Final Recommendation.

    IMPORTANT: You MUST append a strict JSON code block at the very end of your response containing the exact metrics, formatted exactly like this:
    ```json
    {
      "opportunity_score": 85,
      "competition_level": "Medium",
      "strengths": ["Strong demand", "Low entry barrier"],
      "weaknesses": ["High initial cost"],
      "opportunities": ["Global expansion"],
      "threats": ["New regulations"]
    }
    ```

financial_analysis_task:
  description: >
    Based on the following business report:

    {business_report}

    Generate a detailed financial report including:
    - Estimated Revenue
    - Required Investment
    - ROI Percentage
    - Break-even Period
    - Financial Risks
    - Financial Recommendations

  expected_output: >
    A detailed financial report with:
    - Revenue Estimation
    - Investment Requirement
    - ROI %
    - Break-even Analysis
    - Risk Analysis
    - Financial Recommendations

    IMPORTANT: You MUST append a strict JSON code block at the very end of your response containing the exact metrics, formatted exactly like this:
    ```json
    {
      "initial_investment": 50000,
      "projected_roi": 120,
      "break_even_month": 8,
      "first_year_revenue": 150000,
      "burn_rate": 5000
    }
    ```

validation_task:
  description: >
    Based on the following financial report:

    {financial_report}

    Validate the startup idea and provide:

    1. Market Demand Percentage
    2. Success Probability Percentage
    3. Risk Percentage
    4. Competition Level
    5. Growth Potential
    6. Final Recommendation (Good / Moderate / Not Recommended)

    Also generate dashboard metrics, category scores, projected 7-year market growth, recommended revenue mix, a detailed risk assessment, and recommended next steps.

  expected_output: >
    ## Business Validation Report
    [Provide your detailed text report here]

    IMPORTANT: You MUST append a strict JSON code block at the very end of your response containing the exact metrics, formatted exactly like this:
    ```json
    {
      "market_demand": 85,
      "success_probability": 75,
      "risk_percentage": 25,
      "competition_level": "Low",
      "growth_potential": 90,
      "final_recommendation": "GOOD",
      "demand_score": 88,
      "growth_score": 92,
      "investment_score": 80,
      "risk_score": 25
    }
    ```