trend_analysis_task:
  description: >
    Search the current market using web sources and identify:

    - Top trending domains
    - Trending jobs and career opportunities
    - Emerging technologies
    - Customer demand
    - Industry growth opportunities
    - Recommended startup and business ideas

    Provide the latest market information and recommendations.

  expected_output: >
    A detailed report containing:

    1. Trending Domains
    2. Trending Jobs
    3. Emerging Technologies
    4. Customer Demand
    5. Industry Growth Opportunities
    6. Recommended Business and Startup Ideas.

business_discovery_task:
  description: >
    Analyze the domain {field} with a budget of {budget}.

    Identify:

    - Businesses that can be started
    - Jobs suitable for this domain and budget
    - Current market demand
    - Competitors
    - Revenue opportunities
    - Budget feasibility
    - Risks and recommendations

  expected_output: >
    A detailed report containing:

    1. Suggested Businesses
    2. Suggested Jobs
    3. Market Demand Analysis
    4. Competitor Analysis
    5. Revenue Opportunities
    6. Budget Feasibility
    7. Risks
    8. Final Recommendation.

financial_analysis_task:
  description: >
    Based on the following business discovery report:

    {business_report}

    Analyze and provide:

    - Estimated startup cost
    - Monthly operational expenses
    - Revenue projections
    - Profit estimation
    - Break-even analysis
    - ROI (Return on Investment)
    - Financial risks

    Also analyze the market internally and suggest:

    - Unique features that are not commonly available in the market
    - Innovative ideas to increase revenue
    - Features that improve customer engagement and business growth

  expected_output: >
    A detailed report containing:

    1. Startup Cost Estimation
    2. Monthly Expenses
    3. Revenue Projection
    4. Profit Estimation
    5. Break-even Analysis
    6. ROI
    7. Financial Risks
    8. Unique Feature Suggestions
    9. Revenue Growth Strategies
    10. Final Recommendation