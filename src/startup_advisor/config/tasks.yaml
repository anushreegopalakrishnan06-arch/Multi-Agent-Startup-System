trend_analysis_task:
  description: >
    Search the current market using web sources and identify:

    - Top trending domains
    - Trending jobs and career opportunities
    - Emerging technologies
    - Customer demand
    - Industry growth opportunities
    - Recommended startup and business ideas

    Provide the latest market information and recommendations.

  expected_output: >
    A detailed report containing:

    1. Trending Domains
    2. Trending Jobs
    3. Emerging Technologies
    4. Customer Demand
    5. Industry Growth Opportunities
    6. Recommended Business and Startup Ideas.

business_discovery_task:
  description: >
    Analyze the domain {field} with a budget of {budget}.

    Identify:

    - Businesses that can be started
    - Jobs suitable for this domain and budget
    - Current market demand
    - Competitors
    - Revenue opportunities
    - Budget feasibility
    - Risks and recommendations

  expected_output: >
    A detailed report containing:

    1. Suggested Businesses
    2. Suggested Jobs
    3. Market Demand Analysis
    4. Competitor Analysis
    5. Revenue Opportunities
    6. Budget Feasibility
    7. Risks
    8. Final Recommendation.

financial_analysis_task:
  description: >
    Based on the following business report:

    {business_report}

    Generate a detailed financial report including:
    - Estimated Revenue
    - Required Investment
    - ROI Percentage
    - Break-even Period
    - Financial Risks
    - Financial Recommendations

  expected_output: >
    A detailed financial report with:
    - Revenue Estimation
    - Investment Requirement
    - ROI %
    - Break-even Analysis
    - Risk Analysis
    - Financial Recommendations

validation_task:
  description: >
    Based on the following financial report:

    {financial_report}

    Validate the startup idea and provide:

    1. Market Demand Percentage
    2. Success Probability Percentage
    3. Risk Percentage
    4. Competition Level
    5. Growth Potential
    6. Final Recommendation (Good / Moderate / Not Recommended)

    Also generate dashboard metrics.

  expected_output: >
    ## Business Validation Report

    Market Demand: XX%
    Success Probability: XX%
    Risk Percentage: XX%
    Competition Level: Low/Medium/High
    Growth Potential: XX%

    Final Recommendation:
    GOOD STARTUP IDEA / MODERATE / NOT RECOMMENDED

    Dashboard Metrics:
    - Demand Score: XX/100
    - Growth Score: XX/100
    - Investment Score: XX/100
    - Risk Score: XX/100